<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>P.A. Dual UI System Preview</title>
    <style>
        :root {
            --bg-grass: #8DB87A; /* */
            --coral: #F08070;
            --yellow: #F5D76E;
            --sand: #D4B896;
            --phone-body: #1a1a1a;
            --ui-white: rgba(255, 255, 255, 0.9);
        }

        body {
            background-color: var(--bg-grass);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Apple SD Gothic Neo', sans-serif;
        }

        /* [캐릭터 위치 가이드] */
        #character {
            position: absolute;
            left: 50%;
            top: 60%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 140px;
            background: #eee; /* 캐릭터 모델 대용 */
            border-radius: 40px;
            border: 4px solid rgba(0,0,0,0.1);
        }

        /* 1. 인벤토리: 머리 위 토글 (동물의 숲/딩컴 스타일) */
        #inventory-container {
            position: absolute;
            left: 50%;
            bottom: 120%; /* 캐릭터 머리 위 */
            transform: translateX(-50%) scale(0);
            width: 300px;
            background: var(--ui-white);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            pointer-events: none;
        }

        #inventory-container.active {
            transform: translateX(-50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .inv-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .slot {
            aspect-ratio: 1;
            background: #efe4d0;
            border: 2px solid #d4c5a9;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
        }

        .slot:hover { background: var(--yellow); }

        /* 2. 스마트폰: 좌하단 대기 -> 중앙 팝업 (데이브 스타일) */
        #smartphone-container {
            position: absolute;
            left: 30px;
            bottom: -500px; /* 숨겨진 위치 */
            width: 280px;
            height: 520px;
            background: var(--phone-body);
            border-radius: 35px;
            padding: 12px;
            transition: all 0.5s ease-in-out;
            cursor: pointer;
            z-index: 100;
        }

        /* 마우스 근접 시 살짝 올라옴 */
        #smartphone-container:hover {
            bottom: -450px;
        }

        /* 활성화 시 화면 중앙으로 */
        #smartphone-container.active {
            left: 50%;
            bottom: 50%;
            transform: translate(-50%, 50%);
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: #fdf6e3;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 3. 상시 노출 핫바 (하단 중앙) */
        #hotbar {
            position: absolute;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 15px;
        }

        .hot-slot {
            width: 50px;
            height: 50px;
            background: var(--ui-white);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border: 2px solid transparent;
        }

        .hot-slot.selected { border-color: var(--yellow); box-shadow: 0 0 10px var(--yellow); }

        .guide {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="guide">
    <b>조작 가이드:</b><br>
    - <b>I 키:</b> 가방 토글 (머리 위)<br>
    - <b>P 키 또는 폰 클릭:</b> 스마트폰 토글 (중앙 이동)
</div>

<div id="character">
    <div id="inventory-container">
        <h3 style="margin: 0 0 10px 0; font-size: 16px; color: var(--coral);">BAG (Inventory)</h3>
        <div class="inv-grid">
            <div class="slot">🌾</div><div class="slot">🥕</div><div class="slot">🪓</div><div class="slot">🪵</div><div class="slot">🔨</div>
            <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
        </div>
    </div>
</div>

<div id="smartphone-container" onclick="togglePhone()">
    <div class="phone-screen">
        <div style="background: var(--sand); padding: 15px; text-align: center; font-weight: bold;">P.A. MANAGER</div>
        <div style="padding: 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
            <div style="text-align:center;">📊<br><small>감사</small></div>
            <div style="text-align:center;">🤝<br><small>채용</small></div>
            <div style="text-align:center;">📱<br><small>피드</small></div>
            <div style="text-align:center;">⚙️<br><small>설정</small></div>
        </div>
        <div style="margin-top: auto; padding: 20px; font-size: 12px; color: #999; text-align: center;">Press P to Close</div>
    </div>
</div>

<div id="hotbar">
    <div class="hot-slot selected">🪓</div>
    <div class="hot-slot">🔨</div>
    <div class="hot-slot">⛏️</div>
    <div class="hot-slot"></div>
    <div class="hot-slot"></div>
</div>

<script>
    const inv = document.getElementById('inventory-container');
    const phone = document.getElementById('smartphone-container');

    function toggleInv() {
        inv.classList.toggle('active');
        if(phone.classList.contains('active')) togglePhone();
    }

    function togglePhone() {
        phone.classList.toggle('active');
        if(inv.classList.contains('active')) toggleInv();
    }

    window.addEventListener('keydown', (e) => {
        if(e.key.toLowerCase() === 'i') toggleInv();
        if(e.key.toLowerCase() === 'p') togglePhone();
    });
</script>

</body>
</html>
