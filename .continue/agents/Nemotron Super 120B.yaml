name: NVIDIA Game Dev
version: 0.0.1
schema: v1

models:
  - name: Nemotron Super 120B
    provider: nvidia
    model: nvidia/nemotron-3-super-120b-a12b
    apiKey: ${{ secrets.NVIDIA_API_KEY }}

    roles:
      - chat
      - edit
      - apply

    capabilities:
      - tool_use

    defaultCompletionOptions:
      contextLength: 65536
      maxTokens: 8192
      temperature: 1.0
      topP: 0.95

    requestOptions:
      timeout: 180000
      extraBodyProperties:
        chat_template_kwargs:
          enable_thinking: true
        reasoning_budget: 8192